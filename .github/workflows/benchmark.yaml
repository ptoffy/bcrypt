name: benchmark

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "**.swift"
      - "Package.resolved"
      - "Benchmarks/**"
      - ".github/workflows/benchmark.yaml"

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark-vs-main:
    name: ${{ matrix.os }} ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
        configuration: [release, debug]
        include:
          - os: ubuntu-latest
            container: swiftlang/swift:nightly-6.4.x-noble

    steps:
      - name: Install dependencies (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          apt-get update -q
          apt-get install -yq libjemalloc-dev jq curl zstd

      - name: Install dependencies (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: brew install jemalloc

      - name: Install Swift (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.4"

      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: git config --global --add safe.directory '*'

      - name: Cache benchmark build
        uses: actions/cache@v4
        with:
          path: Benchmarks/.build
          key: benchmarks-${{ matrix.os }}-${{ matrix.configuration }}-${{ hashFiles('Benchmarks/Package.resolved') }}
          restore-keys: benchmarks-${{ matrix.os }}-${{ matrix.configuration }}-

      - name: Run benchmarks for the pull request
        run: |
          swift package -c release --disable-sandbox \
            --package-path Benchmarks \
            benchmark baseline update pull_request --no-progress --quiet \
            --benchmark-build-configuration ${{ matrix.configuration }}

      # The merge base is benchmarked with the pull request's Package.resolved so that both runs use
      # the same package-benchmark plugin (older pins may lack flags used here). If the merge base
      # cannot be benchmarked at all, the comparison is skipped rather than failing the job.
      - name: Run benchmarks for the merge base
        id: base
        continue-on-error: true
        run: |
          cp Benchmarks/Package.resolved "${RUNNER_TEMP}/Package.resolved"
          git stash
          git checkout --quiet ${{ github.event.pull_request.base.sha || 'main' }}
          cp "${RUNNER_TEMP}/Package.resolved" Benchmarks/Package.resolved
          swift package -c release --disable-sandbox \
            --package-path Benchmarks \
            benchmark baseline update main --no-progress --quiet \
            --benchmark-build-configuration ${{ matrix.configuration }}

      # The read/check/compare commands enumerate the benchmark targets of the checked-out package,
      # and the merge base may have fewer targets than the pull request, so go back to the PR first.
      # --force discards the Package.resolved we copied over the merge base; baselines are untracked.
      - name: Restore the pull request checkout
        run: git checkout --quiet --force ${{ github.sha }}

      - name: Read pull request results
        run: |
          swift package -c release --disable-sandbox \
            --package-path Benchmarks \
            benchmark baseline read pull_request \
            --format markdown --benchmark-build-configuration ${{ matrix.configuration }} \
            | tee benchmark.md

      - name: Compare benchmarks
        id: comparison
        if: ${{ steps.base.outcome == 'success' }}
        run: |
          set +e
          swift package -c release --disable-sandbox \
            --package-path Benchmarks \
            benchmark baseline check main pull_request \
            --format markdown --benchmark-build-configuration ${{ matrix.configuration }} \
            | tee comparison.md
          CHECK_EXIT=$?
          set -e
          echo "exit-status=${CHECK_EXIT}" >> "${GITHUB_OUTPUT}"

          printf '\n---\n\n' >> comparison.md
          swift package -c release --disable-sandbox \
            --package-path Benchmarks \
            benchmark baseline compare main pull_request \
            --no-progress --quiet --benchmark-build-configuration ${{ matrix.configuration }} \
            --format markdown >> comparison.md

      - name: Construct result comment
        env:
          MARKER: "<!-- benchmark-report-${{ matrix.os }}-${{ matrix.configuration }} -->"
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "${MARKER}"
            echo "## [Benchmark](${RUN_URL}) report: ${{ matrix.os }}, ${{ matrix.configuration }}"
            echo ""
            case '${{ steps.comparison.outputs.exit-status }}' in
              0) echo '**✅ No significant performance differences**' ;;
              1) echo '**❓ Significant performance differences**' ;;
              2) echo '**❌ Significant performance regressions**' ;;
              4) echo '**⚠️ Significant performance improvements**' ;;
              '') echo '**ℹ️ The merge base could not be benchmarked, showing pull request results only**' ;;
              *) echo '**🚫 Benchmark comparison failed with exit code ${{ steps.comparison.outputs.exit-status }}**' ;;
            esac
            echo ""
            if [ -f comparison.md ]; then
              printf '<details>\n<summary>Comparison against main</summary>\n\n%s\n\n</details>\n\n' "$(cat comparison.md)"
            fi
            printf '<details>\n<summary>Pull request results</summary>\n\n%s\n\n</details>\n' "$(cat benchmark.md)"
          } > comment.md
          cat comment.md >> "${GITHUB_STEP_SUMMARY}"

      # GITHUB_TOKEN is read-only for pull requests from forks, so only comment on same-repo PRs.
      - name: Post or update the PR comment
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: "<!-- benchmark-report-${{ matrix.os }}-${{ matrix.configuration }} -->"
        run: |
          BODY="$(jq -Rs . comment.md)"
          EXISTING="$(curl -sS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/issues/${PR_NUMBER}/comments?per_page=100" \
            | jq -r --arg marker "${MARKER}" '[.[] | select(.body | contains($marker))][0].id // empty')"

          if [ -n "${EXISTING}" ]; then
            curl -sS -o /dev/null -w "update comment ${EXISTING}: %{http_code}\n" \
              -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/issues/comments/${EXISTING}" \
              -d "{\"body\": ${BODY}}"
          else
            curl -sS -o /dev/null -w "create comment: %{http_code}\n" \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/issues/${PR_NUMBER}/comments" \
              -d "{\"body\": ${BODY}}"
          fi

      # Only regressions (2) fail the job; differences (1), improvements (4) and a skipped comparison pass.
      - name: Fail on regressions
        run: |
          case '${{ steps.comparison.outputs.exit-status }}' in
            ''|0|1|4) exit 0 ;;
            *) exit 1 ;;
          esac
