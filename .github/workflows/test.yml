name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:noble
    steps:
      - name: Install curl & node
        run: apt-get update -yq && apt-get install -y curl nodejs
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint
        run: swift-format lint --recursive --strict --parallel .
      - name: Build
        run: swift build
      - name: Test
        run: swift test --enable-code-coverage
