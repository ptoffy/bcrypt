name: test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.15
    with:
      linux_swift_versions: '["6.4"]'
      linux_os_versions: '["noble"]'
      enable_linux_static_sdk_build: true
      linux_static_sdk_versions: '["6.4"]'
      enable_wasm_sdk_build: true
      wasm_sdk_versions: '["6.4"]'
      enable_embedded_wasm_sdk_build: true
      enable_android_sdk_build: true
      android_sdk_versions: '["6.4"]'
      # enable_macos_checks: true
      # macos_xcode_versions: '["swift_6.4"]'
      # enable_ios_checks: true
      # ios_host_xcode_versions: '["swift_6.4"]'
      enable_windows_checks: true
      windows_swift_versions: '["nightly-6.4.x"]'

  unit-tests-macos:
    name: Unit tests (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Install Swift
        run: |
          curl -sSL https://download.swift.org/swiftly/darwin/swiftly.pkg -o "${RUNNER_TEMP}/swiftly.pkg"
          installer -pkg "${RUNNER_TEMP}/swiftly.pkg" -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --assume-yes --skip-install --no-modify-profile --quiet-shell-followup
          . "${SWIFTLY_HOME_DIR:-${HOME}/.swiftly}/env.sh"
          swiftly install --use --assume-yes 6.4
          echo "SWIFTLY_HOME_DIR=${SWIFTLY_HOME_DIR}" >> "${GITHUB_ENV}"
          echo "SWIFTLY_BIN_DIR=${SWIFTLY_BIN_DIR}" >> "${GITHUB_ENV}"
          echo "${SWIFTLY_BIN_DIR}" >> "${GITHUB_PATH}"
          swift --version
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@main
    with:
      format_check_enabled: true
      api_breakage_check_enabled: true
      api_breakage_check_container_image: "swift:6.4-noble"
      docs_check_enabled: true
      docs_check_container_image: "swift:6.4-noble"
      license_header_check_enabled: false
      unacceptable_language_check_enabled: false
      broken_symlink_check_enabled: false
      shell_check_enabled: false
      yamllint_check_enabled: false
      python_lint_check_enabled: false
