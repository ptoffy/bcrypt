name: benchmark
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]

env:
  CHECK_NAME: "benchmark / benchmark-vs-main (debug)"

jobs:
  benchmark-vs-thresholds:
    runs-on: ubuntu-latest
    container: swift:noble

    steps:
      # jemalloc is a dependency of the Benchmarking package
      # actions/cache will detect zstd and will become much faster.
      - name: Install jemalloc, zstd, curl, jq and node
        run: |
          apt update -q && apt install -yq libjemalloc-dev zstd curl jq nodejs

      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Run benchmarks for PR
        run: |
          swift package --disable-sandbox \
            --package-path Benchmarks \
            --allow-writing-to-directory .benchmarkBaselines/ \
            benchmark baseline update pull_request --no-progress --quiet --benchmark-build-configuration debug

      - name: Run benchmarks for main
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git stash
          git checkout main
          swift package --disable-sandbox \
            --package-path Benchmarks \
            --allow-writing-to-directory .benchmarkBaselines/ \
            benchmark baseline update main --no-progress --quiet --benchmark-build-configuration debug

      - name: Compare benchmarks
        id: comparison
        run: |
          TIMESTAMP="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "## Benchmark check running at ${TIMESTAMP}" | tee -a comparison.md

          swift package --disable-sandbox \
            --package-path Benchmarks \
            benchmark baseline read pull_request \
            --format markdown --benchmark-build-configuration debug \
            | tee -a benchmark.md

          # Disable 'set -e' to prevent the script from exiting on non-zero exit codes
          set +e
          swift package -c release --disable-sandbox \
            --package-path Benchmarks \
            benchmark baseline check main pull_request \
            --format markdown \
            | tee -a comparison.md
          CHECK_EXIT=$?
          set -e

          echo "exit-status=${CHECK_EXIT}" >> "${GITHUB_OUTPUT}"

          # Add detailed comparison
          echo "" >> comparison.md
          echo "---" >> comparison.md
          echo "" >> comparison.md
          swift package -c release --disable-sandbox \
            --package-path Benchmarks \
            benchmark baseline compare main pull_request \
            --no-progress --quiet --benchmark-build-configuration debug \
            --format markdown >> comparison.md

      - name: Construct result comment
        run: |
          echo "## [Debug Benchmark](${SERVER_URL}$/${{ github.repository }}/actions/runs/${{ github.run_id }}) Report" | tee -a comment.md
          echo "" | tee -a comment.md

          EXIT_CODE='${{ steps.comparison.outputs.exit-status }}'
          case "${EXIT_CODE}" in
              0) echo '**✅ Pull request has no significant performance differences**' | tee -a comment.md ;;
              1) echo '**❓ Pull request has significant performance differences**' | tee -a comment.md ;;
              2) echo '**❌ Pull request has significant performance regressions**' | tee -a comment.md ;;
              4) echo '**⚠️ Pull request has significant performance improvements**' | tee -a comment.md ;;
              *) echo '**🚫 Benchmark comparison failed with unknown exit code ${EXIT_CODE}**' | tee -a comment.md ;;
          esac

          printf '<details>\n  <summary>Click to expand comparison result</summary>\n\n%s\n\n</details>\n\n' "$(cat comparison.md)" | tee -a comment.md
          printf '<details>\n  <summary>Click to expand benchmark result</summary>\n\n%s\n\n</details>\n\n' "$(cat benchmark.md)" | tee -a comment.md

      - name: Update comment in PR
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BOT_TOKEN: ${{ secrets.COMMENT_PR_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          SERVER_URL="${{ github.server_url }}"

          COMMENT_BODY=$(cat comment.md | jq -Rs .)

          echo "📝 Posting final comment to PR #${PR_NUMBER}..."

          RESPONSE=$(curl -w "\n%{http_code}" -s \
            -X POST \
            -H "Authorization: token ${BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            "${SERVER_URL}/api/v1/repos/${OWNER}/${REPO}/issues/${PR_NUMBER}/comments" \
            -d "{\"body\": ${COMMENT_BODY}}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

          if [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Comment posted successfully!"
          else
            echo "❌ Failed to post comment. HTTP Status: $HTTP_CODE"
            echo "Response: $(echo "$RESPONSE" | sed '$d')"
            exit 1
          fi

      - name: Output the comment as job summary
        run: |
          cat comment.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Exit with comparison status
        run: exit ${{ steps.comparison.outputs.exit-status }}
